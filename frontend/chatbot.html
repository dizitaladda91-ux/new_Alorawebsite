<!-- ALORA CHATBOT WIDGET (BENÉ) -->
<div id="alora-chatbot-wrapper" class="fixed bottom-5 right-5 z-[9999] font-sans antialiased">

    <!-- Floating Trigger Button with BENÉ AI Avatar -->
    <button id="alora-chat-trigger"
            onclick="window.toggleAloraChat()"
            class="relative flex items-center gap-2.5 pl-1.5 pr-3.5 py-1.5 bg-[#3B2418] text-[#FAF7F2] rounded-full shadow-2xl hover:bg-[#2B1E16] hover:scale-105 active:scale-95 transition-all duration-300 group focus:outline-none border-2 border-[#E8A33D]">
        <span class="sr-only">Chat with BENÉ, Alora Radiance Skincare Guide</span>

        <div id="alora-chat-icon-open" class="relative w-11 h-11 rounded-full overflow-hidden border-2 border-[#E8A33D] shrink-0 bg-[#FAF7F2]">
            <img src="./static/bene-avatar.jpg" alt="BENÉ AI Skincare Guide" class="w-full h-full object-cover">
        </div>

        <div id="alora-chat-icon-close" class="hidden w-11 h-11 rounded-full bg-[#E8A33D] text-[#2B1E16] flex items-center justify-center text-lg shrink-0">
            <i class="fas fa-times"></i>
        </div>

        <div class="hidden sm:flex flex-col text-left pr-1 leading-tight">
            <span class="text-xs font-bold tracking-wide text-[#FAF7F2]">Ask BENÉ</span>
            <span class="text-[10px] text-[#E8A33D] font-medium">Skincare Guide</span>
        </div>

        <!-- Notification Pulse Indicator -->
        <span id="alora-chat-badge" class="absolute -top-0.5 -right-0.5 flex h-3.5 w-3.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#E8A33D] opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-[#E8A33D] border-2 border-[#3B2418]"></span>
        </span>
    </button>

    <!-- Floating Chat Modal Window -->
    <div id="alora-chat-modal"
         class="hidden fixed bottom-24 right-5 w-[calc(100vw-2.5rem)] sm:w-[400px] h-[590px] max-h-[calc(100vh-8rem)] bg-[#FAF7F2] rounded-3xl shadow-2xl border border-[#3B2418]/15 flex-col overflow-hidden transition-all duration-300 transform scale-95 opacity-0 origin-bottom-right">

        <!-- Header -->
        <div class="bg-[#3B2418] text-white px-4 py-3.5 flex items-center justify-between shadow-md border-b border-[#E8A33D]/30">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-11 h-11 rounded-full overflow-hidden border-2 border-[#E8A33D] bg-[#FAF7F2] shadow-sm">
                        <img src="./static/bene-avatar.jpg" alt="BENÉ AI Skincare Guide" class="w-full h-full object-cover">
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-400 border-2 border-[#3B2418] rounded-full"></span>
                </div>
                <div>
                    <h3 class="font-bold text-sm tracking-wide text-[#FAF7F2] flex items-center gap-1.5">
                        BENÉ &bull; Skincare Guide
                    </h3>
                    <p class="text-[11px] text-[#E8A33D] font-medium">Alora Radiance &bull; Online</p>
                </div>
            </div>

            <div class="flex items-center space-x-1 text-[#F2EBDA]/80">
                <button id="bene-voice-toggle" onclick="window.toggleBeneVoice()" class="hover:text-[#E8A33D] transition-colors p-2 text-xs rounded-full hover:bg-white/10" title="Mute / Unmute Voice">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button onclick="window.clearAloraChat()" class="hover:text-[#E8A33D] transition-colors p-2 text-xs rounded-full hover:bg-white/10" title="Clear Chat History">
                    <i class="fas fa-trash-alt"></i>
                </button>
                <button onclick="window.toggleAloraChat()" class="hover:text-[#E8A33D] transition-colors p-2 text-sm rounded-full hover:bg-white/10" title="Close Chat">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Chat Body Messages -->
        <div id="alora-chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3.5 bg-[#FAF7F2] text-[#3B2418] text-sm scroll-smooth">

            <!-- Welcome Message -->
            <div class="flex items-start space-x-2.5">
                <img src="./static/bene-avatar.jpg" alt="BENÉ" class="w-8 h-8 rounded-full object-cover border border-[#E8A33D] flex-shrink-0 mt-0.5 shadow-sm">
                <div class="bg-white border border-[#3B2418]/10 p-3.5 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] space-y-2.5">
                    <p class="text-[#3B2418] text-xs sm:text-sm leading-relaxed">
                        Hi, main <strong>BENÉ</strong> hoon, Alora Radiance ki skincare guide. Aapki skin type kya hai? Oily, dry, combination, sensitive ya normal?
                    </p>
                    <button type="button" onclick="window.playBeneIntro()" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#F2EBDA] hover:bg-[#E8A33D] text-[#3B2418] text-[11px] font-bold transition-colors cursor-pointer">
                        <i class="fa-solid fa-volume-high text-[10px]"></i>
                        <span>Listen Intro</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Quick Suggestions Chips -->
        <div id="alora-quick-suggestions" class="px-3 py-2.5 bg-[#F2EBDA]/70 border-t border-[#3B2418]/10 flex items-center gap-1.5 overflow-x-auto scrollbar-none text-xs">
            <button onclick="window.sendAloraQuickQuery('Meri skin oily hai aur acne hai')"
                    class="whitespace-nowrap px-3 py-1 bg-white border border-[#E8A33D] text-[#2B1E16] font-semibold rounded-full hover:bg-[#E8A33D] transition-all shadow-2xs cursor-pointer">
                Oily / Acne
            </button>
            <button onclick="window.sendAloraQuickQuery('Dry skin ke liye kya best hai?')"
                    class="whitespace-nowrap px-3 py-1 bg-white border border-[#E8A33D] text-[#2B1E16] font-semibold rounded-full hover:bg-[#E8A33D] transition-all shadow-2xs cursor-pointer">
                Dry Skin
            </button>
            <button onclick="window.sendAloraQuickQuery('Combo packs aur offers batao')"
                    class="whitespace-nowrap px-3 py-1 bg-white border border-[#E8A33D] text-[#2B1E16] font-semibold rounded-full hover:bg-[#E8A33D] transition-all shadow-2xs cursor-pointer">
                Combos &amp; Offers
            </button>
            <button onclick="window.sendAloraQuickQuery('Shipping aur return policy kya hai?')"
                    class="whitespace-nowrap px-3 py-1 bg-white border border-[#E8A33D] text-[#2B1E16] font-semibold rounded-full hover:bg-[#E8A33D] transition-all shadow-2xs cursor-pointer">
                Shipping &amp; Returns
            </button>
        </div>

        <!-- Footer Input Form -->
        <form id="alora-chat-form" onsubmit="window.handleAloraChatSubmit(event)" class="p-3 bg-white border-t border-[#3B2418]/10 flex items-center space-x-2">
            <input type="text"
                   id="alora-chat-input"
                   placeholder="Apna sawal likhein..."
                   autocomplete="off"
                   class="flex-1 bg-[#FAF7F2] border border-[#3B2418]/15 text-[#3B2418] text-xs sm:text-sm rounded-full px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-[#E8A33D] focus:border-transparent transition-all placeholder:text-[#787392]">
            <button type="submit"
                    id="alora-chat-send-btn"
                    class="w-10 h-10 bg-[#E8A33D] hover:bg-[#D48D2A] text-[#2B1E16] rounded-full flex items-center justify-center text-sm transition-all focus:outline-none shadow-md disabled:opacity-50 cursor-pointer shrink-0">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>

    </div>
</div>
