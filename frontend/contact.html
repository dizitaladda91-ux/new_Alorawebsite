<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Jost:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/static/site.webmanifest">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Alora Radiance</title>
  <meta name="description" content="Contact Alora Radiance with your questions or feedback.">
  <link rel="stylesheet" href="./styles/tailwind.min.css">
  <link rel="stylesheet" href="./styles/typography.css">
</head>
<body class="min-h-screen bg-cream font-sans text-brown">
  <div id="navbar-placeholder"></div>
  <main class="mx-auto max-w-3xl px-4 py-12 sm:px-6 sm:py-16">
    <section class="rounded-2xl border border-brown/10 bg-cream p-6 shadow-sm sm:p-10">
      <h1 class="font-sans text-3xl font-bold sm:text-4xl">Contact Us</h1>
      <p class="mt-3 text-sm text-brown/75">Send us a message using the form below.</p>
      <form id="contact-form" class="mt-8 space-y-5" novalidate>
        <div>
          <label for="contact-name" class="mb-1 block text-sm font-semibold">Name</label>
          <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required class="w-full rounded-lg border border-brown/20 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brown">
        </div>
        <div>
          <label for="contact-email" class="mb-1 block text-sm font-semibold">Email</label>
          <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required class="w-full rounded-lg border border-brown/20 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brown">
        </div>
        <div>
          <label for="contact-message" class="mb-1 block text-sm font-semibold">Message</label>
          <textarea id="contact-message" name="message" rows="6" maxlength="2000" required class="w-full rounded-lg border border-brown/20 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brown"></textarea>
        </div>
        <p id="contact-status" class="min-h-5 text-sm" role="status" aria-live="polite" aria-atomic="true"></p>
        <button type="submit" class="rounded-lg bg-cream px-6 py-3 font-bold text-brown transition hover:bg-cream focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#F2EBDA]">Send Message</button>
      </form>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="./js/include.min.js"></script>
  <script type="module" src="./js/navbar-interactions.min.js"></script>
  <script type="module" src="./js/contact-form.min.js"></script>
</body>
</html>
