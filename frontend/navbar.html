            <div id="search-container" class="hidden absolute top-full left-0 right-0 w-full bg-white p-3 shadow-xl border-t border-gray-100 z-50 flex items-center justify-between gap-3 px-4 md:px-8">

                    <input type="text" placeholder="Search clean formulations..." id="search-input" class="w-full text-sm text-black border border-gray-300 rounded-none px-4 py-2.5 pr-10 focus:outline-none focus:border-[#3A0E14]" autocomplete="off">
