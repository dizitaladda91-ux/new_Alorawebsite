<!DOCTYPE html>
<html lang="en">
<head>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Jost:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Alora Radiance</title>
  <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
  <link rel="canonical" href="https://www.aloraradiance.com/login.html" />
  <meta name="description" content="Log in to your Alora Radiance account to track orders, manage your wishlist, and enjoy exclusive offers.">
  <link rel="stylesheet" href="./styles/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./styles/typography.css">
</head>
<body class="diwali-auth-page relative min-h-screen flex items-center justify-center overflow-x-hidden overflow-y-auto bg-[#FBF7F0] font-sans">

  <div class="diwali-auth-card bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-md mx-4 my-8 relative z-10 border border-amber-900/10">
    <a href="./index.html" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-900 text-lg font-bold flex items-center justify-center transition-all no-underline" title="Close">&times;</a>

    <div id="loginSection">
      <div class="text-center mb-6">
        <img src="./static/logo-brand.png" alt="Alora Radiance" class="w-40 h-auto mx-auto mb-3" width="160" height="57">
        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">Login to Alora</h1>
        <p class="text-xs text-slate-500 mt-1">Welcome back! Enter your credentials to access your account.</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#D98E2B] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Password</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 pr-10 border border-slate-300 rounded-xl focus:border-[#D98E2B] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm p-1.5 focus:outline-none" aria-label="Toggle password view">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="text-right">
          <button type="button" id="showForgotBtn" onclick="toggleViews(true)" class="text-xs font-bold text-[#D98E2B] hover:text-amber-900 transition-colors">Forgot Password?</button>
        </div>
        <button type="submit" id="loginSubmitBtn" class="w-full bg-[#D98E2B] hover:bg-amber-900 text-white py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition-all active:scale-[0.99] cursor-pointer">Login</button>
      </form>
    </div>

    <div id="otpSection" class="hidden">
      <div class="text-center mb-6">
        <img src="./static/logo-brand.png" alt="Alora Radiance" class="w-28 h-auto mx-auto mb-3" width="112" height="40">
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">Verification Code</h2>
        <p class="text-xs text-slate-500 mt-1">Enter the 6-digit code sent to <strong id="otpEmailDisplay" class="text-slate-800 font-mono"></strong></p>
      </div>

      <form id="otpForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">6-Digit Verification Code</label>
          <input type="text" id="otpCode" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required placeholder="••••••" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#D98E2B] focus:ring-2 focus:ring-amber-500/20 outline-none text-center font-mono text-2xl tracking-[0.4em] font-bold text-slate-900 bg-amber-50/20 transition-all">
          <p class="mt-2 text-center text-xs text-slate-500">This code expires in 5 minutes and works once.</p>
        </div>
        <button type="submit" id="verifyOtpBtn" class="w-full bg-[#D98E2B] hover:bg-amber-900 text-white py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition-all active:scale-[0.99] cursor-pointer">Verify &amp; Login</button>
        <div class="flex items-center justify-between mt-3 text-xs">
          <button type="button" id="resendOtpBtn" class="font-bold text-[#D98E2B] hover:text-amber-900 transition-colors cursor-pointer">Resend Code <span id="resendTimerText"></span></button>
          <button type="button" id="backToLoginFromOtpBtn" class="font-bold text-slate-600 hover:text-slate-900 transition-colors cursor-pointer">← Back to Login</button>
        </div>
      </form>
    </div>

    <div id="forgotSection" class="hidden">
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">Forgot Password</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your account email to receive a password reset link.</p>
      </div>
      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Account Email</label>
          <input type="email" id="forgotEmail" required placeholder="Registered account email" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#D98E2B] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Send Link To Email <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
          <input type="email" id="deliveryEmail" placeholder="Alternative email for receiving reset link" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#D98E2B] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <button type="submit" class="w-full bg-[#D98E2B] hover:bg-amber-900 text-white py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition-all active:scale-[0.99] cursor-pointer">Send Reset Link</button>
        <div class="text-center mt-4">
          <button type="button" id="backToLoginBtn" onclick="toggleViews(false)" class="text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">← Back to Login</button>
        </div>
      </form>
    </div>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-600 font-medium">
        Don't have an account? <a href="register.html" class="text-[#D98E2B] font-bold hover:underline ml-1">Register</a>
      </p>
    </div>
  </div>

  <script>
    function toggleViews(showForgot) {
      const loginSection = document.getElementById('loginSection');
      const forgotSection = document.getElementById('forgotSection');
      const otpSection = document.getElementById('otpSection');
      if (otpSection) otpSection.classList.add('hidden');
      if (showForgot) {
        loginSection.classList.add('hidden');
        forgotSection.classList.remove('hidden');
      } else {
        forgotSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
      }
    }
  </script>

  <script src="./js/include.min.js"></script>
  <script type="module" src="./js/auth.min.js"></script>
</body>
</html>
